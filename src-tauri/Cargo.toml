[package]
name = "ifc-academy"
version = "14.0.0"
description = "IFC Academy Windows application"
authors = ["IFC Academy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ifc_academy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-sql = { version = "2.3", features = ["sqlite"] }
tauri-plugin-updater = { version = "2.9" }
tauri-plugin-process = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
