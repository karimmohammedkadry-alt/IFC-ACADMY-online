[package]
name = "ifc-academy-tauri"
version = "1.0.0"
description = "IFC Academy Offline Windows Application"
authors = ["IFC Academy"]
edition = "2021"

[lib]
name = "ifc_academy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
